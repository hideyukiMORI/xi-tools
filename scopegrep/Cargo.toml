[package]
name = "scopegrep"
version = "0.0.0"
description = "grep が返さない「そのヒットが構造のどこに属するか」を返す"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["grep", "yaml", "search", "structure", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

# 🔴 依存はこれ1つ（ARC-004）。`path` と `version` の両方を書くのは、
#    `cargo publish -p scopegrep` で単独 publish できる形を保つためである。
[dependencies]
scopegrep-core = { path = "../scopegrep-core", version = "0.0.0" }
