[package]
name = "fleet-top-core"
version = "0.0.0"
description = "no_std core of fleet-top: parses git/GitHub output into repository state and renders the table"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# 🔴 core 自身の README は持たない。道具の説明はリポジトリの README が正である。
#    それでも `readme` を書くのは clippy::cargo_common_metadata（deny）が
#    publish 可能なクレートに要求するからで、ゲートを緩める代わりの措置である。
readme = "../README.md"
keywords = ["git", "github", "json", "no-std", "parser"]
categories = ["parser-implementations", "no-std", "development-tools"]

[lints]
workspace = true

# 🔴 依存ゼロを保つ（ARC-004）。この crate は alloc しか使わない。
[dependencies]
